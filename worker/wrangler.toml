name = "school-docs-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Static web UI — served automatically for any request that doesn't match /api/*
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "school-docs"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets — do NOT put real values here. Set them with:
#   wrangler secret put RUNNER_TOKEN
#   wrangler secret put B2_KEY_ID
#   wrangler secret put B2_APPLICATION_KEY
#   wrangler secret put B2_BUCKET
#   wrangler secret put B2_ENDPOINT      e.g. s3.us-west-004.backblazeb2.com
#   wrangler secret put B2_REGION        e.g. us-west-004
